syntax = "proto3";

option java_package = "com.saferoom.grpc";
option java_outer_classname = "SafeRoomProto";

service UDPHole{

rpc MenuAns(Menu) returns (Status); 

rpc InsertUser(Create_User) returns (Status); 

rpc VerifyUser(Verification) returns (Status);

rpc VerifyEmail(Request_Client) returns (Status);

rpc ChangePassword(Request_Client) returns (Status);

rpc SearchUsers(SearchRequest) returns (SearchResponse);

rpc GetProfile(ProfileRequest) returns (ProfileResponse);

rpc SendFriendRequest(FriendRequest) returns (FriendResponse);

rpc GetPendingFriendRequests(Request_Client) returns (PendingRequestsResponse);

rpc GetSentFriendRequests(Request_Client) returns (SentRequestsResponse);

rpc AcceptFriendRequest(FriendRequestAction) returns (Status);

rpc RejectFriendRequest(FriendRequestAction) returns (Status);

rpc CancelFriendRequest(FriendRequestAction) returns (Status);

rpc GetFriendsList(Request_Client) returns (FriendsListResponse);

rpc RemoveFriend(RemoveFriendRequest) returns (Status);

rpc GetFriendshipStats(Request_Client) returns (FriendshipStatsResponse);

rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);

rpc EndUserSession(HeartbeatRequest) returns (Status);

// P2P bağlantısı başlatma (online kontrolü dahil)
rpc InitiateP2PConnection(P2PInitRequest) returns (P2PInitResponse);
    
// Tek bir ICE candidate gönderme (trickle) - Deprecated, yerine StreamICE kullan
rpc SendICECandidate(ICECandidateTrickle) returns (Status);

// Karşı tarafın candidate'lerini poll et - Deprecated, yerine StreamICE kullan
rpc PollICECandidates(ICEPollRequest) returns (ICEPollResponse);

// ICE gathering tamamlandı sinyali - Deprecated, yerine StreamICE kullan
rpc ICEGatheringComplete(ICECompleteRequest) returns (Status);

// Trickle ICE için çift yönlü streaming kanal
rpc StreamICE(stream ICEStreamMessage) returns (stream ICEStreamMessage);
    
// P2P session'ı sonlandır
rpc TerminateP2PSession(P2PTerminateRequest) returns (Status);

}

message P2PInitRequest {
    string fromUser = 1;
    string toUser = 2;
}

message P2PInitResponse {
    bool success = 1;
    string message = 2;
    string sessionId = 3;
}

message ICECandidate {
    string foundation = 1;
    string component = 2;
    string protocol = 3;
    string ip = 4;
    int32 port = 5;
    int64 priority = 6;
    string type = 7;
    string mediaType = 8;
}

message ICECandidateTrickle {
    string sessionId = 1;
    string fromUser = 2;
    ICECandidate candidate = 3;
}

message ICEPollRequest {
    string sessionId = 1;
    string username = 2;
    int32 lastCandidateIndex = 3;
}

message ICEPollResponse {
    bool success = 1;
    repeated ICECandidate candidates = 2;
    bool gatheringComplete = 3;
}

message ICEGatheringStatus {
    bool complete = 1;
}

message ICERestart {
    string reason = 1;
    int32 attempt = 2;
}

message ICEStreamMessage {
    string sessionId = 1;
    string fromUser = 2;
    oneof message {
        ICECandidate candidate = 3;
        ICEGatheringStatus gathering = 4;
        ICERestart restart = 5;
    }
}

message ICECompleteRequest {
    string sessionId = 1;
    string username = 2;
}

message P2PTerminateRequest {
    string sessionId = 1;
    string username = 2;
}

message Menu {
	optional string username = 1;
	optional string hash_password = 2;
}

message Create_User {
	string username = 1;
	string email = 2;
	optional string password = 3;
	optional bool is_verified = 4;
	optional string verification_code = 5;
}

message Verification {
	optional string username = 1;
	optional string verify = 2;
}

message Request_Client {
    string username = 1;
}

message FromTo{
    string me = 1;
    string them = 2;
}

message Status {
  string message = 1;
  optional int32 code = 2; // 0 = OK, 1 = NOT_FOUND, 2 = ERROR, vs.
}


message RequestByClient_ID {
	string client_id = 1;
}

message Empty {}

message SearchRequest {
    string searchTerm = 1;
    string currentUser = 2;
}

message UserResult {
    string username = 1;
    string email = 2;
    bool isOnline = 3;
    string lastSeen = 4;
    bool is_friend = 5;
    bool has_pending_request = 6;
}

message SearchResponse {
    bool success = 1;
    string message = 2;
    repeated UserResult users = 3;
}

message ProfileRequest {
    string username = 1;
    string requestedBy = 2;
}

message UserProfile {
    string username = 1;
    string email = 2;
    string joinDate = 3;
    string lastSeen = 4;
    bool isOnline = 5;
    UserStats stats = 6;
    repeated UserActivity recentActivities = 7;
    bool isFriend = 8;
    string friendStatus = 9; // none, pending, friends, blocked
}

message UserStats {
    int32 roomsCreated = 1;
    int32 roomsJoined = 2;
    int32 filesShared = 3;
    int32 messagesSent = 4;
    double securityScore = 5;
}

message UserActivity {
    string activityType = 1;
    string description = 2;
    string timestamp = 3;
    string activityData = 4;
}

message ProfileResponse {
    bool success = 1;
    string message = 2;
    UserProfile profile = 3;
}

message FriendRequest {
    string sender = 1;
    string receiver = 2;
    string message = 3;
}

message FriendResponse {
    bool success = 1;
    string message = 2;
    string status = 3; // sent, accepted, declined, blocked
}

message FriendRequestAction {
    int32 requestId = 1;
    string username = 2;
}

message RemoveFriendRequest {
    string user1 = 1;
    string user2 = 2;
}

message FriendRequestInfo {
    int32 requestId = 1;
    string sender = 2;
    string receiver = 3;
    string message = 4;
    string sentAt = 5;
    string senderEmail = 6;
    string senderLastSeen = 7;
}

message PendingRequestsResponse {
    bool success = 1;
    string message = 2;
    repeated FriendRequestInfo requests = 3;
}

message SentRequestsResponse {
    bool success = 1;
    string message = 2;
    repeated FriendRequestInfo requests = 3;
}

message FriendInfo {
    string username = 1;
    string email = 2;
    string friendshipDate = 3;
    string lastSeen = 4;
    bool isVerified = 5;
    bool isOnline = 6;
}

message FriendsListResponse {
    bool success = 1;
    string message = 2;
    repeated FriendInfo friends = 3;
}

message FriendshipStats {
    int32 totalFriends = 1;
    int32 pendingRequests = 2;
    int32 sentRequests = 3;
}

message FriendshipStatsResponse {
    bool success = 1;
    string message = 2;
    FriendshipStats stats = 3;
}

// Heartbeat messages for online status
message HeartbeatRequest {
    string username = 1;
    string sessionId = 2;
}

message HeartbeatResponse {
    bool success = 1;
    string message = 2;
}